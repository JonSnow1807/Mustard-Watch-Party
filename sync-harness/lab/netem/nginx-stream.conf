user nginx;
worker_processes 1;

events {
  worker_connections 1024;
}

# TCP (stream) proxy: every client connection to :3102 is forwarded to the
# backend on the host. nginx is used instead of socat because socat forks a
# process per connection, which falls over at bot-fleet scale.
stream {
  server {
    listen 3102;
    proxy_pass host.docker.internal:3000;
  }
}
