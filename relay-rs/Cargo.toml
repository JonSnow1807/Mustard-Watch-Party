[package]
name = "relay-rs"
version = "0.1.0"
edition = "2021"
description = "A third conformance implementation of the mustard sync plane, in Rust. Same binary protocol and the same Redis Lua scripts as relay-go."

[[bin]]
name = "relay-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
