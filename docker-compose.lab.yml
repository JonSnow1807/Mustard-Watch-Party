# Multi-instance lab: 3 backend replicas sharing Redis (Lua store + pub/sub
# adapter) behind nginx least_conn.
#
#   docker compose -f docker-compose.lab.yml up -d --build
#
# Entry points:
#   http://localhost:3300        nginx -> least_conn across b1/b2/b3
#   http://localhost:3301..3303  direct per-instance (split-brain proofs)
#
# WebSocket-only clients need no sticky sessions: one long-lived connection
# per client means least_conn balances honestly. (Prod runs 1 instance of
# this same code path, where the browser's polling fallback is harmless.)

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: videouser
      POSTGRES_PASSWORD: videopass
      POSTGRES_DB: videosync
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videouser -d videosync"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build: ./video-sync-backend
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://videouser:videopass@postgres:5432/videosync
    depends_on:
      postgres:
        condition: service_healthy

  backend: &backend
    build: ./video-sync-backend
    environment: &backend-env
      DATABASE_URL: postgresql://videouser:videopass@postgres:5432/videosync
      REDIS_URL: redis://redis:6379
      JWT_SECRET: lab-secret
      PORT: "3000"
      INSTANCE_ID: b1
      FRONTEND_URL: http://localhost:3001
    ports:
      - "3301:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backend2:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: b2
    ports:
      - "3302:3000"

  backend3:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: b3
    ports:
      - "3303:3000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./sync-harness/lab/nginx-lab.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3300:3300"
    depends_on:
      - backend
      - backend2
      - backend3
