name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-sync-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-sync-backend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - run: npm test

  frontend:
    name: frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-sync-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-sync-frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"
