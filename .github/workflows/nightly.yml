name: nightly multi-instance lab

# Medium-scale nightly: the full 3-instance lab (Redis Lua store + pub/sub
# adapter behind nginx least_conn) with a 50-bot fleet. Bigger than the
# per-push tripwire, still honest about runner limits — headline numbers
# come from local hardware-documented sweeps, never CI.

permissions:
  contents: read

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  tlc:
    name: model-check the coordination protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: fetch TLC
        run: curl -sL -o formal/tools/tla2tools.jar --create-dirs https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: TLC (ordered rule must pass; naive must still fail)
        working-directory: formal
        run: |
          java -cp tools/tla2tools.jar tlc2.TLC -config SyncTimeline_ordered.cfg SyncTimeline.tla
          if java -cp tools/tla2tools.jar tlc2.TLC -config SyncTimeline_naive.cfg SyncTimeline.tla; then
            echo "naive rule unexpectedly passed - the spec lost its teeth"; exit 1
          fi
          java -cp tools/tla2tools.jar tlc2.TLC -workers 4 -config SyncActor.cfg SyncActor.tla
          java -cp tools/tla2tools.jar tlc2.TLC -workers 4 -config SyncActor_live.cfg SyncActor.tla
          # exactly-once: both green configs must pass; each degraded design
          # must fail on its NAMED property. Accepting any nonzero TLC exit
          # would let a malformed config or a TLC crash impersonate the
          # intended violation, so the exact message is asserted.
          java -cp tools/tla2tools.jar tlc2.TLC -workers 4 -config SyncExactlyOnce.cfg SyncExactlyOnce.tla
          java -cp tools/tla2tools.jar tlc2.TLC -workers 4 -config SyncExactlyOnce_live.cfg SyncExactlyOnce.tla
          expect_violation() {
            local cfg="$1" prop="$2" spec="$3" out
            if out=$(java -cp tools/tla2tools.jar tlc2.TLC -workers 4 -config "$cfg" "$spec" 2>&1); then
              echo "$cfg unexpectedly passed - the spec lost its teeth"; return 1
            fi
            if ! grep -q "Invariant $prop is violated" <<<"$out"; then
              echo "$cfg failed, but NOT on $prop - TLC output:"; tail -30 <<<"$out"; return 1
            fi
            echo "$cfg: $prop violated as designed"
          }
          expect_violation SyncExactlyOnce_nodedup.cfg AtMostOnce SyncExactlyOnce.tla
          expect_violation SyncExactlyOnce_earlyevict.cfg AtMostOnce SyncExactlyOnce.tla
          expect_violation SyncExactlyOnce_nosnaplog.cfg ReplayReconstructs SyncExactlyOnce.tla
          # set-video fencing: cross-video command application and the
          # dedup-vs-fence ordering inside the atomic apply
          java -cp tools/tla2tools.jar tlc2.TLC -workers 4 -config SyncSetVideo.cfg SyncSetVideo.tla
          java -cp tools/tla2tools.jar tlc2.TLC -workers 4 -config SyncSetVideo_live.cfg SyncSetVideo.tla
          expect_violation SyncSetVideo_nofence.cfg NoCrossVideoApply SyncSetVideo.tla
          expect_violation SyncSetVideo_earlyrecord.cfg DupAnswerImpliesApplied SyncSetVideo.tla

  lab-50:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: boot the 3-instance lab
        run: |
          docker compose -f docker-compose.lab.yml up -d --build
          # `up -d` returns before the backends are up: they wait on the
          # migrate one-shot, which waits on postgres's healthcheck, so on a
          # cold runner readiness lands 2+ minutes later. The old wait allowed
          # exactly 120s and both scheduled failures exhausted it moments
          # before the backends came up. A dispatch of the first fix then
          # exposed the second mechanism: probing ONLY nginx (least_conn)
          # makes readiness a coin flip while the backends boot - one probe
          # lands on the single healthy backend and "succeeds", the next
          # lands on a booting one and 502s. A readiness predicate behind a
          # load balancer must require EVERY instance, or it flaps.
          # Budget ~6 minutes, probe all three backends directly plus nginx,
          # and require redis=ok (same deep-health rule as ci.yml): this job
          # exists to exercise the Lua store, and a 200 with status=degraded
          # would pass a bare -f probe while testing the wrong path.
          # Wall-clock deadline, not an iteration count, and the result is
          # LATCHED - re-probing after a successful break re-rolls the dice,
          # the same flapping-predicate bug as probing only nginx, one layer
          # up. The gate's contract is "every instance proven healthy WITHIN
          # the budget": each curl's timeout is capped to the remaining
          # budget (a pass cannot run long past expiry), a pass that has not
          # completed when the budget expires does not count, and the sleep
          # cannot overshoot. The wait's worst case is exactly the number it
          # advertises.
          booted=0
          deadline=$(( SECONDS + 360 ))
          ready() {
            local p rem
            for p in 3301 3302 3303 3300; do
              rem=$(( deadline - SECONDS ))
              [ "$rem" -ge 1 ] || return 1
              curl -sf --max-time $(( rem < 5 ? rem : 5 )) \
                "http://localhost:$p/health" 2>/dev/null \
                | grep -Eq '"redis"[[:space:]]*:[[:space:]]*"ok"' || return 1
            done
            # the whole pass must complete inside the budget to count
            [ "$SECONDS" -lt "$deadline" ]
          }
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ready; then booted=1; break; fi
            remaining=$(( deadline - SECONDS ))
            [ "$remaining" -le 0 ] && break
            sleep $(( remaining < 3 ? remaining : 3 ))
          done
          [ "$booted" = 1 ] || {
            echo "lab never reached redis=ok on every instance; per-port /health:"
            for p in 3301 3302 3303 3300; do
              printf '%s: ' "$p"
              curl -s --max-time 5 "http://localhost:$p/health" || printf '(no response)'
              echo
            done
            docker compose -f docker-compose.lab.yml ps
            exit 1
          }
      - run: npm ci
        working-directory: sync-harness
      - name: multi-instance proofs
        run: npx tsx src/verify-m6.ts
        working-directory: sync-harness
      - name: 50-bot fleet through nginx (gated)
        run: npx tsx src/bots/run-bots.ts --n 50 --duration 120 --ws http://localhost:3300 --gate
        working-directory: sync-harness
      - name: replay reconciliation over the night's actual traffic
        # TransitionContract + ReplayReconstructs (formal/SyncExactlyOnce.tla)
        # against the append-only logs the fleet just produced: every retained
        # transition legal, newest entry identical to live state, drift rate 0
        run: npx tsx src/replay-check.ts --redis redis://localhost:6380 --gate
        working-directory: sync-harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-lab-results
          path: sync-harness/runs/
          retention-days: 30
      - name: lab logs on failure
        if: failure()
        run: docker compose -f docker-compose.lab.yml logs --tail 100
